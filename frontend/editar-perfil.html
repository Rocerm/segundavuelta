<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar perfil · Segunda Vuelta</title>
  <link rel="icon" href="/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body data-zona="usuario" data-seccion="perfil" data-migas="Editar perfil" data-pagina="editar">
  <main id="pagina" class="contenedor angosto">
    <div class="encabezado-pagina"><div><h1>Editar perfil</h1><p>Así te verán las demás personas de la comunidad.</p></div></div>
    <form id="form-perfil" class="panel" novalidate>
      <div class="persona"><span id="foto-actual"></span>
        <div><div class="etiqueta-campo" style="margin:0">Foto de perfil</div>
        <label class="boton claro chico" for="foto" style="margin:.4rem 0 0;cursor:pointer">Cambiar foto</label>
        <input id="foto" type="file" accept="image/jpeg,image/png,image/webp" class="solo-lectores"></div></div>
      <div class="fila">
        <div><label for="nombre">Nombre</label><input id="nombre" maxlength="50"></div>
        <div><label for="apellido">Apellido</label><input id="apellido" maxlength="50"></div>
      </div>
      <label for="biografia">Biografía</label>
      <textarea id="biografia" maxlength="255" placeholder="Cuéntale a la comunidad quién eres"></textarea>
      <p class="ayuda" id="cuenta-bio">0 / 255</p>
      <p class="ayuda">Para cambiar tu alcaldía, contraseña o intereses ve a <a href="/ajustes.html">Ajustes</a>.</p>
      <div class="acciones"><button class="boton" type="submit">Guardar cambios</button><a class="boton claro" href="/perfil.html">Volver al perfil</a></div>
    </form>
  </main>
  <div id="avisos"></div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/editar-perfil.js"></script>
</body>
</html>
